server {
  listen 80;
  server_name _;
  client_max_body_size 8m;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /health {
    proxy_pass http://core:8788/health;
  }

  location /api/market/stream {
    proxy_pass http://core:8788/market/stream;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://core:8788/;
    proxy_read_timeout 120s;
  }
}
